{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="form-page"><p class="eyebrow">PARTY BUDGET PLANNER</p><h1>Plan your event without guesswork</h1><form method="post" action="/generate-party" class="card form-grid"><label>Total Budget (₹)<input type="number" name="total_budget" min="1" required></label><label>Event Type<select name="party_type"><option>Birthday</option><option>Corporate</option><option>Wedding</option><option>Anniversary</option><option>College Event</option></select></label><label>Guest Count<input type="number" name="guests" min="1" value="50" required></label><label>Venue Type<input name="venue_type" value="Banquet Hall"></label><label><input type="checkbox" name="catering" value="true" checked> Catering required</label><label><input type="checkbox" name="decoration" value="true" checked> Decoration required</label><label><input type="checkbox" name="entertainment" value="true"> Entertainment required</label><label class="full">Additional Requirements<textarea name="additional_requirements" placeholder="Theme, food preference, location, etc."></textarea></label><button class="btn full" type="submit">Generate Party Recommendations</button></form></section>{% endblock %}
