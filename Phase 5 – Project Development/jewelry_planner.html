{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="form-page"><p class="eyebrow">JEWELRY BUDGET PLANNER</p><h1>Match jewelry to your occasion and outfit</h1><form method="post" action="/generate-jewelry" enctype="multipart/form-data" class="card form-grid"><label>Total Budget (₹)<input type="number" name="total_budget" min="1" required></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Reception</option><option>Festival</option><option>Party</option><option>Office Event</option></select></label><label>Style Preferences<input name="preferences" value="Elegant"></label><label>Outfit Description<input name="outfit_description" placeholder="Example: blue silk saree with gold border"></label><label class="full">Optional Outfit Image<input type="file" name="outfit_image" accept="image/*"></label><button class="btn full" type="submit">Generate Jewelry Recommendations</button></form><p class="muted">The image is optional. When Gemini is configured, the AI can use the image for color and style analysis.</p></section>{% endblock %}
