{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="form-page"><p class="eyebrow">HOME INTERIOR PLANNER</p><h1>Design your home within budget</h1><form method="post" action="/generate-home" class="card form-grid"><label>Total Budget (₹)<input type="number" name="total_budget" min="1" required></label><label>Rooms<input name="rooms" value="Living Room, Kitchen, Bedroom"></label><label>Lights Quantity<input type="number" name="lights" min="0" value="2"></label><label>Ceiling Fans<input type="number" name="fans" min="0" value="2"></label><label>Furniture Quantity<input type="number" name="furniture" min="0" value="2"></label><label>Dining Tables<input type="number" name="dining_tables" min="0" value="1"></label><label>Style<select name="style"><option>Modern</option><option>Minimalist</option><option>Traditional</option><option>Luxury</option></select></label><label class="full">Additional Requirements<textarea name="additional_requirements" placeholder="Example: warm lighting, compact furniture"></textarea></label><button class="btn full" type="submit">Generate Home Recommendations</button></form></section>{% endblock %}
