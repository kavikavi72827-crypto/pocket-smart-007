{% extends "base.html" %}{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}<div class="auth-card"><h1>Create account</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><label>Full Name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn" type="submit">Register</button></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}
